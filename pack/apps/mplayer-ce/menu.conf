<keybindings name="default">
    <binding key="UP" cmd="menu up" />
    <binding key="DOWN" cmd="menu down" />
    <binding key="LEFT" cmd="menu left" />
    <binding key="RIGHT" cmd="menu right" />
    <binding key="a" cmd="menu ok" />
    <binding key="b" cmd="menu cancel" />
    <binding key="l" cmd="menu pageup" />
    <binding key="r" cmd="menu pagedown" />
    <binding key="x" cmd="menu hide" />
</keybindings>

<cmdlist name="open" title="Open" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
    <e name="File ..." ok="set_menu open_gcsd"/>	
    <e name="Playlist ..." ok="set_menu open_gcsd_list" />
    <e name="Subtitles ..." ok="set_menu open_gcsd_sub" />
</cmdlist>

<cmdlist name="open_gcsd" title="Choose Card" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
      <e name="Slot A ..." ok="set_menu open_gcsda"/>
      <e name="Slot B ..." ok="set_menu open_gcsdb"/>
      <e name="SD2SP2 ..." ok="set_menu open_gcsd2"/>
      <e name="SMB ..." ok="set_menu open_smb"/>
</cmdlist>

<cmdlist name="open_gcsd_list" title="Choose Card" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
      <e name="Slot A ..." ok="set_menu open_gcsda_list"/>
      <e name="Slot B ..." ok="set_menu open_gcsdb_list"/>
      <e name="SD2SP2 ..." ok="set_menu open_gcsd2_list"/>
      <e name="SMB ..." ok="set_menu open_smb_list"/>
</cmdlist>

<cmdlist name="open_gcsd_sub" title="Choose Card" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
      <e name="Slot A ..." ok="set_menu open_gcsda_sub"/>
      <e name="Slot B ..." ok="set_menu open_gcsdb_sub"/>
      <e name="SD2SP2 ..." ok="set_menu open_gcsd2_sub"/>
</cmdlist>

<filesel name="open_gcsda" path="carda:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_gcsdb" path="cardb:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_gcsd2" path="sd2:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>



<cmdlist name="open_net" title="Network" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
      <e name="JellyCube playlist (Slot A)" ok="loadlist 'carda:/mplayer/jellycube.m3u'
                                              menu hide"/>
      <e name="JellyCube playlist (Slot B)" ok="loadlist 'cardb:/mplayer/jellycube.m3u'
                                              menu hide"/>
      <e name="JellyCube playlist (SD2SP2)" ok="loadlist 'sd2:/mplayer/jellycube.m3u'
                                              menu hide"/>
      <e name="SMB shares ..." ok="set_menu open_smb"/>
</cmdlist>

<cmdlist name="open_smb" title="SMB Shares" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
      <e name="Movies ..." ok="set_menu open_smb1"/>
      <e name="TV ..." ok="set_menu open_smb2"/>
      <e name="Anime TV ..." ok="set_menu open_smb3"/>
      <e name="Anime Movie ..." ok="set_menu open_smb4"/>
      <e name="Music ..." ok="set_menu open_smb5"/>
</cmdlist>

<cmdlist name="open_smb_list" title="SMB Playlists" ptr="►" >
            <e name="‹ ../" ok="menu cancel"/>
      <e name="Movies ..." ok="set_menu open_smb1_list"/>
      <e name="TV ..." ok="set_menu open_smb2_list"/>
</cmdlist>
<filesel name="open_smb1" path="smb1:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_smb2" path="smb2:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_smb3" path="smb3:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_smb4" path="smb4:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_smb5" path="smb5:/" 
         filter="file_ext" 
         file-action="menu hide
                      pause
                      loadfile '%p'"/>
<filesel name="open_smb1_list" path="smb1:/" 
         filter="list_ext" 
         file-action="loadlist '%p'
                      menu hide" />
<filesel name="open_smb2_list" path="smb2:/" 
         filter="list_ext" 
         file-action="loadlist '%p'
                      menu hide" />

<pt name="jump_to" title="Playlist" auto-close="yes"/>

<filesel name="open_gcsda_list" path="carda:/" 
         filter="list_ext" 
         file-action="loadlist '%p'
                      menu hide" />
<filesel name="open_gcsdb_list" path="cardb:/" 
         filter="list_ext" 
         file-action="loadlist '%p'
                      menu hide" />
<filesel name="open_gcsd2_list" path="sd2:/" 
         filter="list_ext" 
         file-action="loadlist '%p'
                      menu hide" />

<filesel name="open_gcsda_sub" path="carda:/" 
         filter="subs_ext" 
         file-action="menu hide
                      pause
                      sub_load '%p'
                      sub_select 1
                      sub_visibility 1" />
<filesel name="open_gcsdb_sub" path="cardb:/" 
         filter="subs_ext" 
         file-action="menu hide
                      pause
                      sub_load '%p'
                      sub_select 1
                      sub_visibility 1" />
<filesel name="open_gcsd2_sub" path="sd2:/" 
         filter="subs_ext" 
         file-action="menu hide
                      pause
                      sub_load '%p'
                      sub_select 1
                      sub_visibility 1" />

<cmdlist name="pref_main" title="Options" ptr="►" >
        <e name="‹ ../" ok="menu cancel"/>
    <e name="General ..." ok="set_menu general_pref"/>
    <e name="Audio ..." ok="set_menu audio_pref"/>
    <e name="Video ..." ok="set_menu video_pref"/>
    <e name="Subtitles ..." ok="set_menu osd_sub_pref"/>
    <e name="Aspect ..." ok="set_menu aspect_pref"/>
    <e name="Files Filter ..." ok="set_menu files_pref"/>
    <e name="Properties ..." ok="set_menu properties"/>
</cmdlist>

<pref name="general_pref" title="General">
      <e property="osdlevel" name="OSD level"/>
      <e property="speed" name="Speed"/>
      <e property="loop" name="Loop"/>
</pref>

<pref name="osd_sub_pref" title="Subtitles">
      <e property="sub" name="Subtitles"/>
      <e property="sub_visibility" name="Visibility"/>
      <e property="sub_forced_only" name="Forced sub only"/>
      <e property="sub_alignment" name="Alignment"/>   
      <e property="sub_pos" name="Position"/>
      <e property="sub_delay" name="Delay"/>
      <e property="sub_scale" name="Scale"/>
</pref>

<pref name="video_pref" title="Video">
      <e property="fullscreen" name="Fullscreen"/>
      <e property="panscan" name="Panscan"/>
      <e property="framedropping" name="Frame dropping"/>
      <e property="vsync" name="VSync"/>
</pref>

<cmdlist name="libaf_pref" title="Audio Filters" >
	  <e name="None" ok="af_clr"/>
      <e name="Extrastereo" ok="af_switch extrastereo"/>
      <e name="Karaoke" ok="af_switch karaoke"/>
      <e name="Scale tempo" ok="af_switch scaletempo"/>
      <e name="Volume normalization" ok="af_switch volnorm"/>
</cmdlist>

<pref name="audio_pref" title="Audio">
      <e property="switch_audio" name="Audio Stream"/>
      <e property="volume" name="Volume"/>
      <e property="balance" name="Balance"/>
      <menu menu="libaf_pref" name="Filters ..."/>
      <e property="mute" name="Mute"/>
      <e property="audio_delay" name="Delay"/>
</pref>

<cmdlist name="aspect_pref" title="Aspect">
    <e name="Original" ok="switch_ratio"/>
    <e name="16:9" ok="switch_ratio 1.778"/>
    <a name="4:3" ok="switch_ratio  1.333"/>
    <a name="2.35:1" ok="switch_ratio 2.350"/>
</cmdlist>

<cmdlist name="files_pref" title="Files Filter" >
      <e name="Display All Files" ok="file_filter 0"/>
      <e name="Display Media Files Only" ok="file_filter 1"/>
</cmdlist>

<pref name="properties" title="Stream Properties">
      <e txt="${filename}" name="Name"/>
      <e txt="${video_format}" name="Video Codec"/>
      <e txt="${video_bitrate}" name="Video Bitrate"/>
      <e txt="${width} x ${height}" name="Resolution"/>
      <e txt="${audio_codec}" name="Audio Codec"/>
      <e txt="${audio_bitrate}" name="Audio Bitrate"/>
      <e txt="${samplerate}, ${channels}" name="Audio Samples"/>
      <e txt="${metadata/Title}" name="Title"/>
      <e txt="${metadata/Artist}" name="Artist"/>
      <e txt="${metadata/Album}" name="Album"/>
      <e txt="${metadata/Year}" name="Year"/>
      <e txt="${metadata/Comment}" name="Comment"/>
      <e txt="${metadata/Track}" name="Track"/>
      <e txt="${metadata/Genre}" name="Genre"/>
      <e txt="${metadata/Software}" name="Software"/>
</pref>

<txt name="about" file="about.txt"/>

<cmdlist name="main" title="MPlayer CE" ptr="►" >
      <e name="Stop" ok="stop"/>
      <e name="Open ..." ok="set_menu open" />
      <e name="Current playlist ..." ok="set_menu jump_to"/>
      <e name="Options ..." ok="set_menu pref_main"/>
      <e name="About" ok="set_menu about"/>
      <e name="Quit" ok="quit"/>
</cmdlist>